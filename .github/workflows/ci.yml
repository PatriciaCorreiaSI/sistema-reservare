name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres-user-test
          POSTGRES_PASSWORD: postgres-password-test
          POSTGRES_DB: reservare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres-user-test
      POSTGRES_PASSWORD: postgres-password-test
      POSTGRES_DB: reservare_test
      DB_HOST: 127.0.0.1
      LOG_NIVEL: INFO
      JWT_SEGREDO: segredo-do-ci-de-32-bytes-testes
      FUSO_FUNCIONAMENTO: America/Sao_Paulo

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Instalar as dependências do uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format . --check

      - name: Tipos
        run: uv run mypy app

      - name: Contrato OpenAPI atualizado
        run: |
          uv run python -m app.comandos.exportar_openapi
          git diff --exit-code -- ../frontend/openapi.json

      - name: Testes com relatório de cobertura
        run: uv run pytest --cov=app  --cov-report=term-missing

      - name: Modelos e migrations de acordo
        run: uv run alembic check

      - name: Vaivém das migrations
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node da versão do .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências do package-lock.json
        run: npm ci

      - name: Tipos gerados atualizados
        run: |
          npm run gerar-tipos
          git diff --exit-code -- src/api/tipos.ts

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos e empacotamento
        run: npm run build

  e2e:
    # O teste caro roda depois dos baratos: se o lint ou o pytest falharem, nem começa.
    needs: [backend, frontend]
    runs-on: ubuntu-24.04

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres-user-test
          POSTGRES_PASSWORD: postgres-password-test
          POSTGRES_DB: reservare_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # O que na máquina vem do .env. POSTGRES_DB, DB_HOST, FUSO_FUNCIONAMENTO e as
    # ADMIN_* vêm do env do webServer, no playwright.config.ts.
    env:
      POSTGRES_USER: postgres-user-test
      POSTGRES_PASSWORD: postgres-password-test
      LOG_NIVEL: INFO
      JWT_SEGREDO: segredo-do-ci-de-32-bytes-testes

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Instalar as dependências do back-end
        working-directory: backend
        run: uv sync --locked

      - name: Instalar o Node da versão do .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências do package-lock.json
        run: npm ci

      - name: Instalar o Chromium e as bibliotecas do sistema
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npx playwright test

      - name: Guardar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: frontend/playwright-report/
          retention-days: 30
